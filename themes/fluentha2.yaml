      sidebar-selected-text-color: "#1b1b1b"
      sidebar-selected-icon-color: "#005fb8"
      sidebar-menu-button-background-color: "#f3f3f3"
      sidebar-menu-button-text-color: "#1b1b1b"
      sidebar-border-color: rgba(0, 0, 0, 0.06)
